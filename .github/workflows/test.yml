name: Test

on:
  push:
    branches: [main]
    paths:
      - 'Packages/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'Packages/**'
      - '.github/workflows/test.yml'

jobs:
  packages:
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Test packages
        run: |
          for package in Packages/*/; do
            echo "::group::swift test $package"
            (cd "$package" && swift test) || exit 1
            echo "::endgroup::"
          done
