name: Test

on:
  push:
    branches: [main]
    paths:
      - 'Packages/Calculator/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'Packages/Calculator/**'
      - '.github/workflows/test.yml'

jobs:
  calculator:
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Test calculator
        working-directory: Packages/Calculator
        run: swift test
