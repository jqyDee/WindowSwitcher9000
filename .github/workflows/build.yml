name: Build and Release WindowSwitcher9000

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags

permissions:
  contents: write

jobs:
  build:
    # macOS 26 / Xcode 26+ required (Liquid Glass, macOS 26 deployment target, KeyboardShortcuts 3.x)
    runs-on: macos-26
    # This ensures the entire job only runs if it's a tag push or a pull request/main push
    # To strictly limit the RELEASE part, we use conditional steps below.
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Test packages
        run: |
          for package in Packages/*/; do
            echo "::group::swift test $package"
            (cd "$package" && swift test) || exit 1
            echo "::endgroup::"
          done

      - name: Extract version
        id: get_version
        run: |
          # Since the trigger is restricted to tags, GITHUB_REF will always be a tag
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      # Signing with the same self-signed certificate for every release keeps the app's identity
      # (bundle ID + certificate) stable, so macOS keeps its Accessibility and Screen Recording
      # permissions across updates. The certificate lives in a temporary keychain for this job only.
      - name: Install signing certificate
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$SIGNING_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build the application
        run: |
          xcodebuild \
            -scheme WindowSwitcher \
            -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION=${{ env.VERSION }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            clean build

      - name: Verify signature
        run: |
          APP="build/Build/Products/Release/WindowSwitcher.app"
          codesign --verify --strict "$APP"
          # must be identified by the certificate, not by a per-build hash (ad-hoc)
          codesign -d -r- "$APP" 2>&1 | tee /dev/stderr | grep -q 'certificate leaf'

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - name: Package build artifact
        run: |
          mkdir -p dist
          cp -R "build/Build/Products/Release/WindowSwitcher.app" dist/WindowSwitcher.app

      - name: Zip the app
        run: |
          cd dist
          zip -r WindowSwitcher9000.zip WindowSwitcher.app

      # Upload artifact for every build (helpful for debugging PRs)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowSwitcher9000-${{ env.VERSION }}-b${{ github.run_number }}
          path: dist/WindowSwitcher9000.zip

      # THE CHANGE: This step and subsequent release steps only run if a tag is present
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: v${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          files: dist/WindowSwitcher9000.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Point the Homebrew cask at this release. Needs the HOMEBREW_TAP_TOKEN secret:
      # a token with Contents read/write access to jqyDee/homebrew-tap (GITHUB_TOKEN can't push to other repos).
      - name: Check out Homebrew tap
        uses: actions/checkout@v5
        with:
          repository: jqyDee/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Bump Homebrew cask
        run: |
          SHA256=$(shasum -a 256 dist/WindowSwitcher9000.zip | cut -d ' ' -f 1)
          cd homebrew-tap
          sed -i '' -E \
            -e "s/^  version \".*\"/  version \"${VERSION}\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"${SHA256}\"/" \
            Casks/window-switcher-9000.rb
          git diff --exit-code --quiet && { echo "Cask already up to date"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "window-switcher-9000 ${VERSION}"
          git push
