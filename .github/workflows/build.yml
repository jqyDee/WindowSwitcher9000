name: Build and Release WindowSwitcher9000

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'  # trigger on version tags
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Build the application
        run: |
          xcodebuild \
            -scheme WindowSwitcher \
            -configuration Release \
            -derivedDataPath build \
            clean build

      - name: Package build artifact
        run: |
          mkdir -p dist
          cp -R "build/Build/Products/Release/WindowSwitcher.app" dist/WindowSwitcher.app

      - name: Zip the app
        run: |
          cd dist
          zip -r WindowSwitcher9000.zip WindowSwitcher.app

      # Always upload the artifact to the Actions summary
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowSwitcher9000
          path: dist/WindowSwitcher9000.zip

      # Only run for tagged pushes
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: dist/WindowSwitcher9000.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
