name: Build WindowSwitcher9000

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'  # Always use the newest Xcode

      - name: Build the application
        run: |
          xcodebuild \
            -scheme WindowSwitcher \
            -configuration Release \
            -derivedDataPath build \
            clean build

      - name: Package build artifact
        run: |
          mkdir -p ${{ github.workspace }}/dist
          cp -R build/Build/Products/Release/WindowSwitcher.app ${{ github.workspace }}/dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowSwitcher9000
          path: ${{ github.workspace }}/dist/WindowSwitcher.app
