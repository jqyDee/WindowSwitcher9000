name: Build and Release WindowSwitcher9000

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'  # Trigger release workflow on version tags
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Build the application
        run: |
          xcodebuild \
            -scheme WindowSwitcher \
            -configuration Release \
            -derivedDataPath build \
            clean build

      - name: Package build artifact
        run: |
          mkdir -p ${{ github.workspace }}/dist
          cp -R "build/Build/Products/Release/WindowSwitcher.app" "${{ github.workspace }}/dist/WindowSwitcher.app"

      - name: Zip the app
        run: |
          cd dist
          zip -r WindowSwitcher9000.zip WindowSwitcher.app

      # Upload artifact on every push/pull request
      - name: Upload build artifact
        if: github.event_name != 'push' || startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: WindowSwitcher9000
          path: ${{ github.workspace }}/dist/WindowSwitcher9000.zip

      # Create release only for tagged commits
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        id: create_release
        uses: actions/create-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-release-asset@v2
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/WindowSwitcher9000.zip
          asset_name: WindowSwitcher9000.zip
          asset_content_type: application/zip
