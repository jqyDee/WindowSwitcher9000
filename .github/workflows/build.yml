name: Build and Release WindowSwitcher9000

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    # This ensures the entire job only runs if it's a tag push or a pull request/main push
    # To strictly limit the RELEASE part, we use conditional steps below.
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Extract version
        id: get_version
        run: |
          # Since the trigger is restricted to tags, GITHUB_REF will always be a tag
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Build the application
        run: |
          xcodebuild \
            -scheme WindowSwitcher \
            -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION=${{ env.VERSION }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            clean build

      - name: Package build artifact
        run: |
          mkdir -p dist
          cp -R "build/Build/Products/Release/WindowSwitcher.app" dist/WindowSwitcher.app

      - name: Zip the app
        run: |
          cd dist
          zip -r WindowSwitcher9000.zip WindowSwitcher.app

      # Upload artifact for every build (helpful for debugging PRs)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowSwitcher9000-${{ env.VERSION }}-b${{ github.run_number }}
          path: dist/WindowSwitcher9000.zip

      # THE CHANGE: This step and subsequent release steps only run if a tag is present
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: v${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          files: dist/WindowSwitcher9000.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
