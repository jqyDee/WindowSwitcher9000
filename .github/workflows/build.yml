name: Build and Release WindowSwitcher9000

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      # 1. Determine the version number from the tag or fallback to a default
      - name: Extract version
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            # If tag is v1.2.3, this sets VERSION to 1.2.3
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          else
            # Fallback for manual builds or main branch pushes
            echo "VERSION=1.0.0" >> $GITHUB_ENV
          fi

      # 2. Build the application with overridden version and build numbers
      - name: Build the application
        run: |
          xcodebuild \
            -scheme WindowSwitcher \
            -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION=${{ env.VERSION }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            clean build

      - name: Package build artifact
        run: |
          mkdir -p dist
          cp -R "build/Build/Products/Release/WindowSwitcher.app" dist/WindowSwitcher.app

      - name: Zip the app
        run: |
          cd dist
          zip -r WindowSwitcher9000.zip WindowSwitcher.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowSwitcher9000-${{ env.VERSION }}-b${{ github.run_number }}
          path: dist/WindowSwitcher9000.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: WindowSwitcher v${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          files: dist/WindowSwitcher9000.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
